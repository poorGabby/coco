steps:
  - name: 'gcr.io/cloud-builders/git'
    args:
      - 'clone'
      - '--depth'
      - '1'
      - '--branch'
      - '${_HERMES_REF}'
      - 'https://github.com/NousResearch/hermes-agent.git'
      - 'src'
  - name: 'gcr.io/cloud-builders/docker'
    dir: 'src'
    env: ['DOCKER_BUILDKIT=1']
    entrypoint: 'bash'
    args:
      - '-c'
      - 'cp ../Dockerfile ./Dockerfile && docker build --build-arg HERMES_GIT_SHA=$$(git rev-parse HEAD) -t ${_IMAGE} .'
images: ['${_IMAGE}']
options:
  machineType: 'E2_HIGHCPU_8'
  diskSizeGb: 100
timeout: '3600s'
